version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      development-patch-minor:
        dependency-type: development
        patterns: ["*"]
        update-types: [patch, minor]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      ruff-patch-minor:
        patterns: [ruff]
        update-types: [patch, minor]
