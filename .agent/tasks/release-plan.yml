schema_version: 1
release: initial-project-workflow
tasks:
  - task_id: "2"
    task_name: Establish a TrueNorth project cockpit and canonical quality gate
    verify_command: ./scripts/verify
    priority: P1
    requirements:
      - Scoped project cockpit with conventions, release plan, and session state.
      - One documented local quality command.
      - Observable verification evidence recorded for the work item.
      - No runtime dependency or preview-first behavior change.
  - task_id: "3"
    task_name: Add a CI quality gate for installer safety and configuration checks
    verify_command: ./scripts/verify
    priority: P1
    requirements:
      - Least-privilege GitHub Actions verification on pull requests and main.
      - Python compilation, shell checks, catalog validation, and no-write previews.
      - Local and hosted verification evidence.
