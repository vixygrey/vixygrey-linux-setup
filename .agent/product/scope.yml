core_value: Safe, preview-first provisioning of a personal Aurora Linux environment.
summary: >
  Vixygrey Linux Setup installs a curated catalog of user-level tools and deploys
  Dracula-Sakura configuration without overwriting existing user files by default.
  The project prioritizes explicit source approval, deterministic planning, and
  conflict preservation over unattended setup.
in_scope:
  - Catalog-controlled user-level application installation for Aurora Linux.
  - Conflict-preserving deployment of managed dotfiles and theme assets.
  - Preview, preflight, verification, and developer workflow tooling.
out_of_scope:
  - OS image mutation, RPM layering, service enablement, group changes, and shell changes.
  - Automatic Homebrew, Flatpak, Docker Engine, credential, or certificate provisioning.
  - Automatic application upgrades, rollback, and cleanup of user-managed state.
constraints:
  - Runtime code uses Python 3.11+ and the standard library only.
  - Apply runs require Aurora Linux and a non-root user.
  - Existing home-directory files and symlink boundaries remain protected.
success_criteria:
  - A user can preview every proposed change before apply.
  - Installation and configuration conflicts are preserved unless explicitly replaced.
  - The canonical quality command proves safety checks and no-write preview behavior.
references:
  - https://github.com/vixygrey/vixygrey-linux-setup/issues/2
