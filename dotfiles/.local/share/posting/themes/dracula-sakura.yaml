name: dracula-sakura
author: vixygrey
description: Dark plum surfaces with sakura pink, lilac, cyan, and mint accents.
primary: "#ff9fe3"
secondary: "#d4b2ff"
background: "#282a36"
surface: "#2f3144"
panel: "#323448"
warning: "#ffcf93"
error: "#ff7aa8"
success: "#8af7cf"
accent: "#9be7ff"
dark: true

text_area:
  gutter: "#8a88c7 on #2f3144"
  cursor: "#282a36 on #ff9fe3"
  cursor_line: "#f8f8f2 on #2f3144"
  cursor_line_gutter: "#d4b2ff on #2f3144"
  matched_bracket: "bold #fff0a8"
  selection: "#f8f8f2 on #6a5d86"

syntax:
  json_key: "#9be7ff"
  json_string: "#fff0a8"
  json_number: "#d4b2ff"
  json_boolean: "#8af7cf"
  json_null: "#ff7aa8"

url:
  base: "#f8f8f2"
  protocol: "#9be7ff"
  separator: "#8a88c7"

variable:
  resolved: "#8af7cf"
  unresolved: "#ff7aa8"

method:
  get: "#9be7ff"
  post: "#8af7cf"
  put: "#ffcf93"
  delete: "#ff7aa8"
  patch: "#ff9fe3"
  options: "#d4b2ff"
  head: "#ffc2ec"
