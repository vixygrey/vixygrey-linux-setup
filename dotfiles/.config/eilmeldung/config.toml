mouse_support = true
enclosure_command = "xdg-open {url}"
auto_reload_config = true

[border_theme]
focused = "rounded"
unfocused = "rounded"
framing = "connected"

[icon_set]
preset = "nerd"

[theme.color_palette]
background = "#282a36"
foreground = "#f8f8f2"
muted = "#8a88c7"
highlight = "#ffc2ec"
flagged = "#ff7aa8"
accent_primary = "#ff9fe3"
accent_secondary = "#d4b2ff"
accent_tertiary = "#9be7ff"
accent_quaternary = "#ffcf93"
info = "#8af7cf"
warning = "#fff0a8"
error = "#ff7aa8"
