gui:
  nerdFontsVersion: "3"
  showBottomLine: false
  showPanelJumps: true
  showRandomTip: false
  showCommandLog: false
  border: rounded
  branchColors:
    '*': '#d4b2ff'
  theme:
    activeBorderColor: ['#ff9fe3', bold]
    inactiveBorderColor: ['#4b4963']
    optionsTextColor: ['#9be7ff']
    selectedLineBgColor: ['#6a5d86']
    inactiveViewSelectedLineBgColor: ['#323448']
    cherryPickedCommitFgColor: ['#8af7cf']
    cherryPickedCommitBgColor: ['#4b4963']
    unstagedChangesColor: ['#ff7aa8']
    defaultFgColor: ['#ddd2f7']
    searchingActiveBorderColor: ['#ffcf93']
git:
  paging:
    colorArg: always
    pager: delta --dark --paging=never
  commit:
    signOff: false
  autoFetch: true
  autoRefresh: true
os:
  edit: 'micro {{filename}}'
  editAtLine: 'micro {{filename}} +{{line}}'
  editAtLineAndWait: 'micro {{filename}} +{{line}}'
  editInTerminal: true
  open: 'xdg-open {{filename}}'
  openLink: 'xdg-open {{link}}'
notARepository: skip
promptToReturnFromSubprocess: false
